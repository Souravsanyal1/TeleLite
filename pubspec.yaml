name: telegram_lite
description: "A lightweight, modern Telegram client built with Flutter, based on TeleLite UI Design System."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  pin_code_fields: ^8.0.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2
  video_player: ^2.9.2
  audio_waveforms: ^1.0.5
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0
  flutter_animated_icons: ^1.0.1
  google_fonts: ^6.2.1
  http: ^1.6.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
